# Load required modules
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule cgi_module modules/mod_cgi.so
LoadModule alias_module modules/mod_alias.so
LoadModule env_module modules/mod_env.so
LoadModule cgid_module modules/mod_cgid.so
LoadModule expires_module modules/mod_expires.so
LoadModule headers_module modules/mod_headers.so
LoadModule deflate_module modules/mod_deflate.so
LoadModule filter_module modules/mod_filter.so

# Event MPM Configuration - Optimized for 16 cores, 60GB RAM
<IfModule mpm_event_module>
    # Main settings
    StartServers             4
    ServerLimit             32
    MinSpareThreads        256
    MaxSpareThreads        512
    ThreadsPerChild        256
    MaxRequestWorkers     8192
    MaxConnectionsPerChild   0
    
    # Connection timeouts
    Timeout              300
    KeepAlive            On
    MaxKeepAliveRequests  0
    KeepAliveTimeout     15
</IfModule>

# Enable compression for text content
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/plain
    AddOutputFilterByType DEFLATE text/html
    AddOutputFilterByType DEFLATE text/xml
    AddOutputFilterByType DEFLATE application/x-git-*
</IfModule>

# Cache settings
<IfModule mod_expires.c>
    ExpiresActive On
    ExpiresByType application/x-git-* "access plus 1 hour"
</IfModule>

# Performance settings
EnableMMAP On
EnableSendfile On