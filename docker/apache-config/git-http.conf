# Git HTTP backend configuration
SetEnv GIT_PROJECT_ROOT /usr/local/apache2/htdocs
SetEnv GIT_HTTP_EXPORT_ALL
ScriptAlias "/git/" "/usr/lib/git-core/git-http-backend/"

<Location "/git/">
    # Authentication is required for pushes (git-receive-pack), but not fetches (git-upload-pack)
    # This is the standard setup for a public mirror
    <If "%{QUERY_STRING} =~ /service=git-receive-pack/">
        # Require authentication for pushes
        AuthType Basic
        AuthName "Git Push Access"
        AuthUserFile /usr/local/apache2/conf/.htpasswd
        Require valid-user
    </If>

    # Allow unauthenticated access for fetches (git-upload-pack) and other requests
    # This is crucial for repo sync to work without needing credentials for the mirror
    <Else>
        Require all granted
    </Else>
</Location>